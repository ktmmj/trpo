services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: servicedesk:local
    container_name: servicedesk-app
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/servicedesk.db
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - servicedesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  servicedesk-data: